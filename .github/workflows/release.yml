name: Release site

on:
  workflow_dispatch:
    inputs:
      message:
        description: '发布说明（可留空）'
        required: false
        default: '手动发版'

permissions:
  contents: write

concurrency:
  group: release-weekly
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Publish dist to weekly branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ inputs.message }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b weekly
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "${MSG:-手动发版}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" weekly
